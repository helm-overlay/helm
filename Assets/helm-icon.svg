<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- tile background: midnight-navy → graphite -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283349"/>
      <stop offset="0.55" stop-color="#161c2a"/>
      <stop offset="1" stop-color="#0c0f17"/>
    </linearGradient>
    <!-- top-down sheen on the tile -->
    <radialGradient id="sheen" cx="0.5" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- steel / off-white for the wheel, lit from top -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="1" stop-color="#b9c3d0"/>
    </linearGradient>
    <radialGradient id="amber" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ffac3a"/>
      <stop offset="1" stop-color="#f4892a"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle tile -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#tile)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#sheen)"/>
  <rect x="92.5" y="92.5" width="839" height="839" rx="187.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- WHEEL: centered at 512,512 -->
  <g filter="url(#drop)">
    <!-- rim / orbital track -->
    <circle cx="512" cy="512" r="250" fill="none" stroke="url(#steel)" stroke-width="26"/>

    <!-- handles (8 stubs beyond the rim) -->
    <g stroke="url(#steel)" stroke-width="22" stroke-linecap="round">
      <line x1="774" y1="512" x2="810" y2="512"/>
      <line x1="512" y1="774" x2="512" y2="810"/>
      <line x1="250" y1="512" x2="214" y2="512"/>
      <line x1="512" y1="250" x2="512" y2="214"/>
      <line x1="697.3" y1="697.3" x2="722.7" y2="722.7"/>
      <line x1="326.7" y1="697.3" x2="301.3" y2="722.7"/>
      <line x1="326.7" y1="326.7" x2="301.3" y2="301.3"/>
      <line x1="697.3" y1="326.7" x2="722.7" y2="301.3"/>
    </g>

    <!-- spokes (hub → rim) -->
    <g stroke="url(#steel)" stroke-width="20" stroke-linecap="round">
      <line x1="564" y1="512" x2="762" y2="512"/>
      <line x1="460" y1="512" x2="262" y2="512"/>
      <line x1="512" y1="564" x2="512" y2="762"/>
      <line x1="512" y1="460" x2="512" y2="262"/>
      <line x1="548.8" y1="548.8" x2="688.8" y2="688.8"/>
      <line x1="475.2" y1="475.2" x2="335.2" y2="335.2"/>
      <line x1="475.2" y1="548.8" x2="335.2" y2="688.8"/>
      <line x1="548.8" y1="475.2" x2="688.8" y2="335.2"/>
    </g>

    <!-- hub -->
    <circle cx="512" cy="512" r="50" fill="url(#steel)"/>
    <circle cx="512" cy="512" r="22" fill="#1a2233"/>
  </g>

  <!-- amber satellite on the orbital track (upper-right) -->
  <g filter="url(#glow)">
    <circle cx="655.4" cy="307.2" r="33" fill="url(#amber)"/>
    <circle cx="648" cy="299" r="9" fill="#fff6e6" fill-opacity="0.85"/>
  </g>
</svg>
