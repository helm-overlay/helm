name: Helm
options:
  bundleIdPrefix: com.eshaanshah.helm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Helm:
    type: application
    platform: macOS
    info:
      path: Sources/Helm/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Helm
        NSAppleEventsUsageDescription: "Helm opens your selected Claude chat in iTerm2."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eshaanshah.helm.app
        ENABLE_HARDENED_RUNTIME: "YES"
    sources:
      - path: Sources/Helm
    dependencies:
      - target: HelmCore

  HelmCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HelmCore
  HelmProbe:
    type: tool
    platform: macOS
    sources:
      - path: Sources/HelmProbe
    dependencies:
      - target: HelmCore
  HelmCoreTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - path: Tests/HelmCoreTests
    dependencies:
      - target: HelmCore
schemes:
  HelmCore:
    build:
      targets:
        HelmCore: all
    test:
      targets:
        - HelmCoreTests
